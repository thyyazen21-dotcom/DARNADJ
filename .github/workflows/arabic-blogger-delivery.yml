name: Arabic Blogger delivery validation
on:
  push:
    branches: [main, "production/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-arabic-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate listing content
        run: python -m unittest discover -s DarnaDJ_Updated_Package/Place-dj-16oct/DELIVERY-ARABIC -p "test_*.py" -v
      - name: Build and validate complete Arabic Blogger XML
        run: python DarnaDJ_Updated_Package/Place-dj-16oct/DELIVERY-ARABIC/generate_ar_delivery.py
      - name: Confirm generated delivery exists
        run: test -s DarnaDJ_Updated_Package/Place-dj-16oct/DELIVERY-ARABIC/theme-PLACE-DJ.AR.xml
